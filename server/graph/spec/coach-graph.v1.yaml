spec_id: coach-graph
version: 5.0.0
description: >
  Coaching agent graph. The Supervisor owns every conditional edge.
  Workers and HITL nodes return only to the Supervisor. PlanConfirm is intentionally
  absent (not in the PRD's named HITL list). Teach, Practice and Remediate are
  subgraphs (draft, critique, revise, execute, check) bounded by max_depth.
  max_steps stays 1: the Supervisor still schedules each as one step.
  A slip after Assess goes to Practice. A placed learner with no plan who is
  not already on a pipeline node goes to Plan. Diagnose without a placement,
  Plan without a skill, or an unknown node that already has a plan goes to Reflect.
  Reflect continues to Plan only when the learner is placed, under the step bound,
  and the previous node was not a Plan that produced no skill. Otherwise an
  unfinished Reflect ends the session.
nodes:
  - id: __start__
    kind: terminal
    task_type: cheap-classify
    max_steps: 0
  - id: Supervisor
    kind: supervisor
    task_type: cheap-classify
    max_steps: 40
  - id: Diagnose
    kind: worker
    task_type: cheap-classify
    max_steps: 1
  - id: Plan
    kind: worker
    task_type: deep-reasoning
    max_steps: 1
  - id: Teach
    kind: worker
    task_type: tutor-chat
    max_steps: 1
    subgraph: true
    max_depth: 2
  - id: Practice
    kind: worker
    task_type: tutor-chat
    max_steps: 1
    subgraph: true
    max_depth: 3
  - id: Assess
    kind: worker
    task_type: grading
    max_steps: 1
  - id: Remediate
    kind: worker
    task_type: tutor-chat
    max_steps: 1
    subgraph: true
    max_depth: 1
  - id: Stretch
    kind: worker
    task_type: deep-reasoning
    max_steps: 1
  - id: Reflect
    kind: worker
    task_type: self-critique
    max_steps: 1
  - id: GradeDispute
    kind: hitl
    task_type: cheap-classify
    max_steps: 1
    type: interrupt
  - id: SkillMapEdit
    kind: hitl
    task_type: cheap-classify
    max_steps: 1
    type: interrupt
  - id: SafetyEscalation
    kind: hitl
    task_type: cheap-classify
    max_steps: 1
    type: interrupt
  - id: End
    kind: terminal
    task_type: cheap-classify
    max_steps: 0
edges:
  - id: e-start
    from: __start__
    to: Supervisor
    condition_id: session.start
    condition_expr: "session_id != ''"
    priority: 1
  - id: e-ret-diagnose
    from: Diagnose
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-plan
    from: Plan
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-teach
    from: Teach
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-practice
    from: Practice
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-assess
    from: Assess
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-remediate
    from: Remediate
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-stretch
    from: Stretch
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-reflect
    from: Reflect
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-dispute
    from: GradeDispute
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-skill
    from: SkillMapEdit
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-ret-safety
    from: SafetyEscalation
    to: Supervisor
    condition_id: worker.return
    condition_expr: "path.length >= 1"
    priority: 1
  - id: e-sup-loop
    from: Supervisor
    to: SafetyEscalation
    condition_id: any.loop_detected
    condition_expr: "loop_detected == true && loop_cleared == false && path[-1] != 'SafetyEscalation'"
    priority: 100
  - id: e-sup-end
    from: Supervisor
    to: End
    condition_id: reflect.done
    condition_expr: "path[-1] == 'Reflect' && session_complete == true"
    priority: 95
  - id: e-sup-step
    from: Supervisor
    to: Reflect
    condition_id: any.step_limit
    condition_expr: "step >= 40 && session_complete == false && path[-1] != 'Reflect'"
    priority: 90
  - id: e-sup-fatigue
    from: Supervisor
    to: Reflect
    condition_id: any.fatigue
    condition_expr: "fatigue >= 0.8 && session_complete == false && path[-1] != 'Reflect'"
    priority: 80
  - id: e-sup-hitl-repeat
    from: Supervisor
    to: End
    condition_id: any.hitl_repeat
    condition_expr: "(disputed == true && path[-1] == 'Reflect' && path[-2] == 'GradeDispute') || (skill_map_edit == true && path[-1] == 'Reflect' && path[-2] == 'SkillMapEdit')"
    priority: 72
  - id: e-sup-dispute
    from: Supervisor
    to: GradeDispute
    condition_id: assess.disputed
    condition_expr: "disputed == true && path[-1] != 'GradeDispute'"
    priority: 70
  - id: e-sup-skill
    from: Supervisor
    to: SkillMapEdit
    condition_id: any.skill_map_edit
    condition_expr: "skill_map_edit == true && path[-1] != 'SkillMapEdit'"
    priority: 60
  - id: e-sup-plan-reflect
    from: Supervisor
    to: Plan
    condition_id: reflect.continue
    condition_expr: "path[-1] == 'Reflect' && session_complete == false && step < 40 && diagnosis.placed == true && !(path[-2] == 'Plan' && (plan == null || plan.skill == null || plan.skill == ''))"
    priority: 56
  - id: e-sup-reflect-stop
    from: Supervisor
    to: End
    condition_id: reflect.stop
    condition_expr: "path[-1] == 'Reflect' && session_complete == false && (step >= 40 || diagnosis.placed != true || (path[-2] == 'Plan' && (plan == null || plan.skill == null || plan.skill == '')))"
    priority: 55
  - id: e-sup-misconception
    from: Supervisor
    to: Remediate
    condition_id: assess.misconception
    condition_expr: "path[-1] == 'Assess' && disputed == false && last_assessment.error_class == 'misconception'"
    priority: 50
  - id: e-sup-fast
    from: Supervisor
    to: Stretch
    condition_id: assess.fast_mastery
    condition_expr: "path[-1] == 'Assess' && disputed == false && last_assessment.error_class == null && last_assessment.score >= 0.85 && last_assessment.confidence >= 0.8"
    priority: 40
  - id: e-sup-replan
    from: Supervisor
    to: Plan
    condition_id: assess.replan
    condition_expr: "path[-1] == 'Assess' && disputed == false && last_assessment.error_class != 'misconception' && last_assessment.error_class != 'slip' && !(last_assessment.error_class == null && last_assessment.score >= 0.85 && last_assessment.confidence >= 0.8)"
    priority: 30
  - id: e-sup-slip
    from: Supervisor
    to: Practice
    condition_id: assess.slip
    condition_expr: "path[-1] == 'Assess' && disputed == false && last_assessment.error_class == 'slip'"
    priority: 35
  - id: e-sup-diagnose
    from: Supervisor
    to: Diagnose
    condition_id: diagnose.needed
    condition_expr: "session_complete == false && diagnosis.placed != true && path[-1] != 'Diagnose'"
    priority: 28
  - id: e-sup-plan
    from: Supervisor
    to: Plan
    condition_id: diagnose.complete
    condition_expr: "path[-1] == 'Diagnose' && diagnosis.placed == true"
    priority: 26
  - id: e-sup-teach
    from: Supervisor
    to: Teach
    condition_id: plan.ready
    condition_expr: "path[-1] == 'Plan' && plan.skill != null && plan.skill != ''"
    priority: 24
  - id: e-sup-practice
    from: Supervisor
    to: Practice
    condition_id: teach.complete
    condition_expr: "path[-1] == 'Teach'"
    priority: 22
  - id: e-sup-assess
    from: Supervisor
    to: Assess
    condition_id: practice.complete
    condition_expr: "path[-1] == 'Practice'"
    priority: 20
  - id: e-sup-practice-rem
    from: Supervisor
    to: Practice
    condition_id: remediate.done
    condition_expr: "path[-1] == 'Remediate'"
    priority: 18
  - id: e-sup-reflect-stretch
    from: Supervisor
    to: Reflect
    condition_id: stretch.done
    condition_expr: "path[-1] == 'Stretch'"
    priority: 16
  - id: e-sup-hitl-reject
    from: Supervisor
    to: End
    condition_id: hitl.rejected
    condition_expr: "(path[-1] == 'GradeDispute' || path[-1] == 'SkillMapEdit' || path[-1] == 'SafetyEscalation') && hitl_log[-1].decision == 'reject'"
    priority: 96
  - id: e-sup-reflect-dispute
    from: Supervisor
    to: Reflect
    condition_id: dispute.resolved
    condition_expr: "path[-1] == 'GradeDispute'"
    priority: 15
  - id: e-sup-reflect-skill
    from: Supervisor
    to: Reflect
    condition_id: skill_map.resolved
    condition_expr: "path[-1] == 'SkillMapEdit'"
    priority: 14
  - id: e-sup-reflect-safety
    from: Supervisor
    to: Reflect
    condition_id: safety.resolved
    condition_expr: "path[-1] == 'SafetyEscalation'"
    priority: 13
  - id: e-sup-ready
    from: Supervisor
    to: Plan
    condition_id: session.ready
    condition_expr: "diagnosis.placed == true && (plan == null || plan.skill == null || plan.skill == '') && path[-1] != 'Diagnose' && path[-1] != 'Plan' && path[-1] != 'Teach' && path[-1] != 'Practice' && path[-1] != 'Assess' && path[-1] != 'Remediate' && path[-1] != 'Stretch' && path[-1] != 'Reflect' && path[-1] != 'GradeDispute' && path[-1] != 'SkillMapEdit' && path[-1] != 'SafetyEscalation'"
    priority: 12
  - id: e-sup-dead
    from: Supervisor
    to: Reflect
    condition_id: any.dead_end
    condition_expr: "(path[-1] == 'Diagnose' && diagnosis.placed != true) || (path[-1] == 'Plan' && diagnosis.placed == true && (plan == null || plan.skill == null || plan.skill == '')) || (diagnosis.placed == true && plan != null && plan.skill != null && plan.skill != '' && path[-1] != null && path[-1] != 'Diagnose' && path[-1] != 'Plan' && path[-1] != 'Teach' && path[-1] != 'Practice' && path[-1] != 'Assess' && path[-1] != 'Remediate' && path[-1] != 'Stretch' && path[-1] != 'Reflect' && path[-1] != 'GradeDispute' && path[-1] != 'SkillMapEdit' && path[-1] != 'SafetyEscalation')"
    priority: 1
